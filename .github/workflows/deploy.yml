name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Base URL of the deployed xoxo-integrations Cloudflare Worker (see
          # worker/ and INTEGRATIONS_SETUP.md). Until this repo secret is set,
          # it's an empty string, which src/lib/integrations.ts treats the
          # same as "unset" — the app builds and runs exactly as before.
          VITE_INTEGRATIONS_API_URL: ${{ secrets.VITE_INTEGRATIONS_API_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
